name: Smoke test (whole environment)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: team-ops
      - uses: actions/checkout@v7
        with:
          repository: yuukioda999/team-ops-api
          path: team-ops-api
      - uses: actions/checkout@v7
        with:
          repository: yuukioda999/team-ops-web
          path: team-ops-web
      - uses: actions/checkout@v7
        with:
          repository: yuukioda999/notify-relay
          path: notify-relay

      - name: Validate compose.yaml
        working-directory: team-ops
        run: make config

      - name: Start every service
        working-directory: team-ops
        run: docker compose up -d --build

      - name: Wait for health endpoints
        run: |
          check() {
            for i in $(seq 1 90); do
              if curl -fsS "$1" > /dev/null; then echo "OK  $1"; return 0; fi
              sleep 5
            done
            echo "TIMEOUT  $1"; return 1
          }
          check http://localhost:8080/healthz
          check http://localhost:8000/api/health
          check http://localhost:8025/api/v1/info
          check http://localhost:5173/

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: team-ops/e2e/package-lock.json

      - name: Install the end-to-end tests
        working-directory: team-ops/e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: End-to-end tests (001〜006, demo mode off)
        working-directory: team-ops/e2e
        run: npx playwright test

      - name: Turn demo mode on (spec 007)
        working-directory: team-ops
        run: |
          sed -i 's/^DEMO_MODE=false/DEMO_MODE=true/' env/api.env
          docker compose up -d --force-recreate api api-worker api-scheduler
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/demo > /dev/null; then echo "demo mode on"; exit 0; fi
            sleep 5
          done
          echo "demo mode did not come up"; exit 1

      - name: End-to-end tests (007, demo mode on)
        working-directory: team-ops/e2e
        run: npx playwright test tests/007-demo-mode.spec.ts

      - name: Keep the screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            team-ops/e2e/test-results
            team-ops/e2e/playwright-report
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        working-directory: team-ops
        run: docker compose logs --no-color --tail=200

      - name: Stop
        if: always()
        working-directory: team-ops
        run: docker compose down -v
