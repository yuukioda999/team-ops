# Local development environment for team-ops.
# Expects the four repositories side by side:
#   team-ops/  team-ops-api/  team-ops-web/  notify-relay/
# Run `make setup` once, then `make up`.

name: team-ops

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306" # this machine only: root/root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./env/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_ENABLE_CHAOS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # This machine only: the received mail holds login links
      - "127.0.0.1:8025:8025"   # web UI: received mail
      - "127.0.0.1:1025:1025"   # SMTP

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      # This machine only, like every port below (the local keys are public)
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  api:
    build:
      context: ../team-ops-api
      target: dev
    volumes:
      - ../team-ops-api:/app
    env_file:
      - ./env/api.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    # Healthy once composer install and the migrations are done and the server answers
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  api-worker:
    build:
      context: ../team-ops-api
      target: dev
    volumes:
      - ../team-ops-api:/app
    env_file:
      - ./env/api.env
    command: ["php", "artisan", "queue:work", "--tries=3"]
    restart: unless-stopped
    depends_on:
      # Wait for the api container's composer install and migrations (they share the mounted code)
      api:
        condition: service_healthy

  # Runs scheduled commands such as outbox:redispatch every minute (ADR-0002)
  api-scheduler:
    build:
      context: ../team-ops-api
      target: dev
    volumes:
      - ../team-ops-api:/app
    env_file:
      - ./env/api.env
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  notify-relay:
    build:
      context: ../notify-relay
    environment:
      PORT: "8080"
      # Recipients outside .invalid are refused (same setting as on the API)
      RECIPIENTS_INVALID_ONLY: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none # Mailpit only; real mail services use starttls or tls
      SMTP_FROM: no-reply@team-ops.invalid
      SMTP_FROM_NAME: チーム運営
      # Local-only dummy signing key, shared with env/api.env (NOTIFY_RELAY_SECRET)
      ALLOW_LOCAL_SIGNING_KEY: "true" # the dummy keys below are public; refused without this
      RELAY_SIGNING_KEYS: "local:bG9jYWwtZGV2LXJlbGF5LXNpZ25pbmcta2V5LTAwMDE="
      # Local-only dummy key for the email_ref kept in logs instead of addresses (ADR-0003)
      EMAIL_REF_KEY: "bG9jYWwtZGV2LXJlbGF5LWVtYWlsLXJlZi1rZXktMDAx"
      DB_DSN: "notify_relay:notify_relay@tcp(mysql:3306)/notify_relay?parseTime=true"
      # Results go back to the API by webhook, signed with the key above (ADR-0019)
      WEBHOOK_URL: "http://api:8000/api/internal/notify-relay/events"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4318"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ../team-ops-web
      target: dev
    volumes:
      - ../team-ops-web:/app
      - web-node-modules:/app/node_modules
    environment:
      API_PROXY_TARGET: "http://api:8000"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  web-node-modules:
